;[lat/long:]

;------------- Sinusoïdal -------------------

; Nota XP 15-03-2022: A la taula de sinònims de geodèsia, M_IdOfic.dbf, no hi ha un equivalent EPSG per al cas MODIS perquè no el vam trobar. De fet, una cerca a Internet amb les tres
; paraules EPSG MODIS Sinusoidal no retorna res de bo, a part de problemes de la gent. En aquesta taula M_IdOfic.dbf hi he fet constar tres sinònims per a Sinusoidal-V5-MODIS, que són:
; * SR-ORG:6842 que està documentat a https://spatialreference.org/ref/sr-org/modis-sinusoidal/ .
; * SR-ORG:6974 https://spatialreference.org/ref/sr-org/modis-sinusoidal-3/
; * SR-ORG:6965 https://spatialreference.org/ref/sr-org/modis-sinusoidal-2/
; En aquests 3 webs diu que són especificacions per a la sinusoïdal de MODIS en totes 3, i l'enllaç que porta cap a una descripció dels paràmetres desglossats permet deduir que en
; realitat són variants de codificació per a introduir més o menys error en els programaris que no tracten "correctament" l'especificació esfèrica amb un radi mitjà autàlic (que és el
; que toca segons diu a la 6974 i és el que fem al MiraMon), o que no admeten només un radi menor, etc. La 6974 diu que és la millor, "corregida" de la 6842 (aquesta usa un sol radi,
; esfèric, de 6371007.181 m, mentre que la 6974 usa 6378137 m amb 298.257223563 de RECFLATT, però en canvi indica que els dos radis són iguals a 6371007.181, o sigui el mateix que
: l'anterior). També diu que el programari que assumeixi la manera 6842 de definir el SRH "may introduce datum-shift errors". La 6965 indica, com la 6974, que és una altra versió
; "corregida" de la 6842, però amb el radi menor a 6378137 i sense explicitar el major, explicant que l'han creada perquè "Not all projection software recognizes the "semi_minor"
; argument to Sinusoidal projections". Informo específicament el Lluís que he deixat documentats aquests sinònims a la taula, i aquesta explicació en aquest fitxer M_ValPrj.ini.

